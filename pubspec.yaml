name: portfolio
description: "Portfolio d'Amar Hammour — Web Designer & Digital Creative."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  fonts:
    # Fraunces optique "display" — grands titres (hero, sections, footer).
    - family: FrauncesDisplay
      fonts:
        - asset: assets/fonts/FrauncesDisplay-Bold.ttf
          weight: 700
        - asset: assets/fonts/FrauncesDisplay-Black.ttf
          weight: 900

    # Fraunces optique "texte" — titres de cartes, citations.
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-Regular.ttf
          weight: 400
        - asset: assets/fonts/Fraunces-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/Fraunces-Bold.ttf
          weight: 700
        - asset: assets/fonts/Fraunces-Black.ttf
          weight: 900

    # Manrope — texte courant, labels, boutons.
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Regular.ttf
          weight: 400
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700

    # Caveat — signature manuscrite.
    - family: Caveat
      fonts:
        - asset: assets/fonts/Caveat-Regular.ttf
          weight: 400
